<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Detektiv-Jagd</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #243b55 0%,
                    #141e30 45%,
                    #080d14 100%
                );

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 28px;

            padding: 35px 25px;

            text-align: center;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .logo {
            font-size: 70px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cbd5e1;
            font-size: 17px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;

            padding: 17px;

            border-radius: 14px;

            border: 1px solid rgba(255, 255, 255, 0.18);

            background: rgba(0, 0, 0, 0.25);

            color: white;

            font-size: 17px;

            outline: none;
        }

        input::placeholder {
            color: #aeb8c6;
        }

        input:focus {
            border-color: #60a5fa;

            box-shadow:
                0 0 0 3px rgba(96, 165, 250, 0.15);
        }

        button {
            width: 100%;

            padding: 17px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s,
                opacity 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .connection-status {
            margin-top: 22px;

            padding: 10px 14px;

            border-radius: 12px;

            background: rgba(0, 0, 0, 0.2);

            color: #facc15;

            font-size: 14px;
        }

        .connection-status.online {
            color: #4ade80;
        }

        .connection-status.offline {
            color: #f87171;
        }

        .message {
            margin-top: 18px;

            padding: 14px;

            border-radius: 12px;

            white-space: pre-wrap;

            font-size: 15px;

            line-height: 1.5;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.15);

            border: 1px solid rgba(239, 68, 68, 0.35);

            color: #fca5a5;
        }

        .message.success {
            background: rgba(34, 197, 94, 0.15);

            border: 1px solid rgba(34, 197, 94, 0.35);

            color: #86efac;
        }

        .hint {
            margin-top: 25px;

            color: #94a3b8;

            font-size: 13px;

            line-height: 1.5;
        }

        .admin-link {
            margin-top: 25px;
        }

        .admin-link a {
            color: #94a3b8;

            text-decoration: none;

            font-size: 13px;
        }

        .admin-link a:hover {
            color: white;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">
            🕵️
        </div>

        <h1>
            Willkommen Detektive
        </h1>

        <p class="subtitle">
            Gebt euren Teamnamen und euren
            Gruppen-PIN ein, um die Detektiv-Jagd
            zu starten.
        </p>


        <div class="form">

            <input
                id="teamInput"
                type="text"
                placeholder="👥 Teamname"
                autocomplete="off"
            >

            <input
                id="groupPinInput"
                type="text"
                inputmode="numeric"
                placeholder="🔐 Gruppen-PIN"
                autocomplete="off"
            >

            <button
                id="joinButton"
                type="button"
            >
                🔎 Gruppe betreten
            </button>

        </div>


        <div
            id="connectionStatus"
            class="connection-status"
        >
            🟡 Verbindung zur Zentrale wird hergestellt...
        </div>


        <div
            id="joinMessage"
            class="message"
        ></div>


        <p class="hint">
            💡 Euer Spielleiter gibt euch
            den Gruppen-PIN.
        </p>


        <div class="admin-link">
            <a href="admin.html">
                ⚙️ Spielleiter-Bereich
            </a>
        </div>

    </main>


    <!-- Firebase -->
    <script
        type="module"
        src="firebase.js"
    ></script>

    <!-- Hauptprogramm -->
    <script
        src="app.js"
    ></script>

</body>
</html>

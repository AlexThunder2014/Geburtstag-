<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>⚙️ Spielleiter-Zentrale</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =========================================
     LOGIN
     ========================================= -->

<section
    id="adminLogin"
    class="screen active"
>

    <div class="card hero-card admin-login">

        <div class="big-icon">
            🔐
        </div>

        <h1>
            Spielleiter-Zentrale
        </h1>

        <p>
            Gib deine Admin-PIN ein.
        </p>


        <input
            id="adminPassword"
            type="password"
            inputmode="numeric"
            maxlength="20"
            placeholder="Admin-PIN"
            autocomplete="off"
        >


        <button
            id="loginButton"
            class="main-button"
        >
            🔓 Zentrale öffnen
        </button>


        <div
            id="loginMessage"
            class="message"
        ></div>

    </div>

</section>



<!-- =========================================
     DASHBOARD
     ========================================= -->

<section
    id="adminDashboard"
    class="screen admin-dashboard"
>

    <header class="admin-header">

        <div>

            <span class="small-label">
                SPIELLEITER
            </span>

            <h1>
                🕵️ Detektiv-Zentrale
            </h1>

        </div>


        <button
            id="logoutButton"
            class="secondary-button"
        >
            🚪 Beenden
        </button>

    </header>



    <!-- =====================================
         GRUPPEN
         ===================================== -->

    <div class="admin-section">

        <div class="section-heading">

            <div>

                <span class="small-label">
                    LIVE
                </span>

                <h2>
                    👥 Gruppen
                </h2>

            </div>


            <button
                id="deleteAllGroupsButton"
                class="danger-button"
            >
                🧹 Alle Gruppen löschen
            </button>

        </div>


        <div
            id="groupsContainer"
            class="groups-container"
        >

            <div class="empty-state">

                ⏳ Gruppen werden geladen...

            </div>

        </div>

    </div>



    <!-- =====================================
         NEUE GRUPPE
         ===================================== -->

    <div class="admin-section">

        <h2>
            ➕ Neue Gruppe
        </h2>


        <div class="form-grid">

            <div>

                <label>
                    Teamname
                </label>

                <input
                    id="newGroupName"
                    type="text"
                    maxlength="30"
                    placeholder="z. B. Team Adler"
                >

            </div>


            <div>

                <label>
                    Gruppen-PIN
                </label>

                <input
                    id="newGroupPin"
                    type="text"
                    inputmode="numeric"
                    maxlength="8"
                    placeholder="z. B. 4821"
                >

            </div>

        </div>


        <button
            id="createGroupButton"
            class="main-button"
        >
            👥 Gruppe erstellen
        </button>


        <div
            id="groupCreateMessage"
            class="message"
        ></div>

    </div>



    <!-- =====================================
         MISSION ERSTELLEN
         ===================================== -->

    <div class="admin-section">

        <span class="small-label">
            NEUE MISSION
        </span>

        <h2>
            ✏️ Eigenen Hinweis erstellen
        </h2>


        <label>
            Titel
        </label>

        <input
            id="missionTitleInput"
            type="text"
            placeholder="z. B. Die geheimnisvolle Spur"
        >


        <label>
            Hinweis
        </label>

        <textarea
            id="missionClueInput"
            rows="4"
            placeholder="Schreibe hier den Hinweis für die Kinder..."
        ></textarea>


        <label>
            Aufgabe
        </label>

        <textarea
            id="missionTaskInput"
            rows="4"
            placeholder="Was sollen die Kinder tun?"
        ></textarea>


        <label>
            Richtige Lösung
        </label>

        <input
            id="missionSolutionInput"
            type="text"
            placeholder="z. B. SPIELPLATZ"
        >


        <label>
            An welche Gruppe senden?
        </label>

        <select id="missionGroupSelect">

            <option value="">
                -- Gruppe auswählen --
            </option>

        </select>


        <button
            id="sendMissionButton"
            class="main-button"
        >
            📡 Hinweis an Gruppe senden
        </button>


        <div
            id="missionSendStatus"
            class="message"
        ></div>

    </div>



    <!-- =====================================
         NACHRICHT
         ===================================== -->

    <div class="admin-section">

        <h2>
            📢 Nachricht senden
        </h2>


        <label>
            Gruppe
        </label>

        <select id="messageGroupSelect">

            <option value="">
                -- Gruppe auswählen --
            </option>

        </select>


        <label>
            Nachricht
        </label>

        <textarea
            id="adminMessageInput"
            rows="4"
            placeholder="Nachricht an die Gruppe..."
        ></textarea>


        <button
            id="sendMessageButton"
            class="main-button"
        >
            📢 Nachricht senden
        </button>


        <div
            id="messageStatus"
            class="message"
        ></div>

    </div>



    <!-- =====================================
         SPIEL BEENDEN
         ===================================== -->

    <div class="admin-section finish-section">

        <h2>
            🏆 Spiel
        </h2>


        <label>
            Gruppe auswählen
        </label>

        <select id="finishGroupSelect">

            <option value="">
                -- Gruppe auswählen --
            </option>

        </select>


        <button
            id="finishGameButton"
            class="danger-button"
        >
            🏁 Gruppe als abgeschlossen markieren
        </button>


        <div
            id="finishStatus"
            class="message"
        ></div>

    </div>


</section>



<script
    type="module"
    src="firebase.js"
></script>

<script
    type="module"
    src="admin.js"
></script>


</body>

</html>
